name: Cobertura de código

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    name: Verificar Cobertura de Testes

    steps:
      - name: Clonar repositório
        uses: actions/checkout@v3

      - name: Instalar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Cache de dependências
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Instalar dependências
        run: npm install

      - name: Executar testes com cobertura
        run: npm run test:coverage

      - name: Fazer upload da cobertura para Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage/coverage-final.json
          flags: unittests
          name: codecov-umbrella

      - name: Instalar bc (necessário para comparação)
        run: sudo apt-get install -y bc

      - name: Verificar cobertura mínima na branch principal
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          if [ ! -f coverage/coverage-summary.json ]; then
            echo "Arquivo de cobertura não encontrado!"
            exit 1
          fi
          
          COVERAGE=$(cat coverage/coverage-summary.json | grep -o '"lines":[^}]*' | grep -o '[0-9]\+\.[0-9]\+' | head -1)
          
          echo "Cobertura de testes: ${COVERAGE}%"
          
          if (( $(echo "$COVERAGE < 90" | bc -l) )); then
            echo "Cobertura de testes abaixo do mínimo de 90%!"
            exit 1
          fi
          
          echo "Cobertura de testes atende ao mínimo de 90%!"